<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スプレッドシートデータベース管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: white;
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 10px;
      margin-top: 10px;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
    }

    .btn-success {
      background: #48bb78;
      color: white;
    }

    .btn-success:hover {
      background: #38a169;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(72, 187, 120, 0.3);
    }

    .btn-danger {
      background: #f56565;
      color: white;
    }

    .btn-danger:hover {
      background: #e53e3e;
    }

    .btn-secondary {
      background: #718096;
      color: white;
    }

    .btn-secondary:hover {
      background: #4a5568;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    thead {
      background: #f7fafc;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }

    th {
      color: #4a5568;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    tbody tr:hover {
      background: #f7fafc;
    }

    .actions {
      display: flex;
      gap: 5px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .message-success {
      background: #c6f6d5;
      color: #22543d;
      border-left: 4px solid #48bb78;
    }

    .message-error {
      background: #fed7d7;
      color: #742a2a;
      border-left: 4px solid #f56565;
    }

    .hidden {
      display: none;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #718096;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 0;
      }

      header, .card {
        border-radius: 0;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 8px 4px;
      }

      .btn {
        padding: 8px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 スプレッドシートデータベース管理</h1>
      <p class="subtitle">Webインターフェースでデータを簡単に管理</p>
    </header>

    <div class="main-content">
      <!-- メッセージ表示エリア -->
      <div id="messageArea"></div>

      <!-- データ追加フォーム -->
      <div class="card">
        <h2>➕ 新規データ追加</h2>
        <form id="addForm">
          <div id="formFields"></div>
          <button type="submit" class="btn btn-success">追加</button>
          <button type="button" class="btn btn-secondary" onclick="clearForm()">クリア</button>
        </form>
      </div>

      <!-- データ一覧 -->
      <div class="card">
        <h2>📋 データ一覧</h2>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="loadData()">🔄 更新</button>
          <button class="btn btn-secondary" onclick="filterActive()">Active のみ表示</button>
          <button class="btn btn-secondary" onclick="loadData()">すべて表示</button>
        </div>
        <div id="dataTable">
          <div class="loading">
            <div class="spinner"></div>
            <p>読み込み中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 編集モーダル（シンプルな実装） -->
  <div id="editModal" class="hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div class="card" style="max-width: 500px; width: 90%; margin: 20px;">
      <h2>✏️ データ編集</h2>
      <form id="editForm">
        <div id="editFormFields"></div>
        <button type="submit" class="btn btn-primary">更新</button>
        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">キャンセル</button>
      </form>
    </div>
  </div>

  <script>
    // グローバル変数
    let allData = [];
    let headers = {};
    let currentEditId = null;

    // 初期化
    document.addEventListener('DOMContentLoaded', function() {
      init();
    });

    async function init() {
      try {
        await loadHeaders();
        await loadData();
        setupForm();
      } catch (error) {
        showMessage('初期化エラー: ' + error.message, 'error');
      }
    }

    // ヘッダー情報を取得
    async function loadHeaders() {
      try {
        const response = await callAPI({ action: 'getHeaders' });
        headers = response;
      } catch (error) {
        throw new Error('ヘッダー情報の取得に失敗しました');
      }
    }

    // フォームをセットアップ
    function setupForm() {
      const formFields = document.getElementById('formFields');
      formFields.innerHTML = '';

      headers.editable.forEach(field => {
        const formGroup = document.createElement('div');
        formGroup.className = 'form-group';
        
        const label = document.createElement('label');
        label.textContent = field;
        
        let input;
        if (field === 'Status') {
          input = document.createElement('select');
          input.innerHTML = '<option value="">選択してください</option><option value="Active">Active</option><option value="Inactive">Inactive</option>';
        } else if (field.includes('Email')) {
          input = document.createElement('input');
          input.type = 'email';
        } else {
          input = document.createElement('input');
          input.type = 'text';
        }
        
        input.id = 'field_' + field;
        input.name = field;
        if (field === 'Name' || field === 'Email') {
          input.required = true;
        }
        
        formGroup.appendChild(label);
        formGroup.appendChild(input);
        formFields.appendChild(formGroup);
      });
    }

    // データを読み込み
    async function loadData() {
      try {
        const dataTable = document.getElementById('dataTable');
        dataTable.innerHTML = '<div class="loading"><div class="spinner"></div><p>読み込み中...</p></div>';
        
        const data = await callAPI({ action: 'findAll' });
        allData = data;
        renderTable(data);
      } catch (error) {
        document.getElementById('dataTable').innerHTML = 
          '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>データの読み込みに失敗しました</p></div>';
        showMessage('データの読み込みエラー: ' + error.message, 'error');
      }
    }

    // テーブルを描画
    function renderTable(data) {
      const dataTable = document.getElementById('dataTable');
      
      if (data.length === 0) {
        dataTable.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>データがありません</p></div>';
        return;
      }

      let html = '<table><thead><tr>';
      
      headers.all.forEach(header => {
        html += `<th>${header}</th>`;
      });
      html += '<th>操作</th></tr></thead><tbody>';

      data.forEach(row => {
        html += '<tr>';
        headers.all.forEach(header => {
          html += `<td>${escapeHtml(row[header] || '')}</td>`;
        });
        html += `<td class="actions">
          <button class="btn btn-primary" onclick='editData("${row[headers.primaryKey]}")'>編集</button>
          <button class="btn btn-danger" onclick='deleteData("${row[headers.primaryKey]}")'>削除</button>
        </td></tr>`;
      });

      html += '</tbody></table>';
      dataTable.innerHTML = html;
    }

    // フォームをクリア
    function clearForm() {
      document.getElementById('addForm').reset();
    }

    // フォーム送信
    document.getElementById('addForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const data = {};
      
      for (let [key, value] of formData.entries()) {
        data[key] = value;
      }

      try {
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = '追加中...';

        await callAPI({ action: 'insert', data: data });
        
        showMessage('データを追加しました', 'success');
        clearForm();
        await loadData();
        
        submitBtn.disabled = false;
        submitBtn.textContent = '追加';
      } catch (error) {
        showMessage('追加エラー: ' + error.message, 'error');
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.textContent = '追加';
      }
    });

    // データを編集
    function editData(id) {
      const row = allData.find(r => r[headers.primaryKey] === id);
      if (!row) {
        showMessage('データが見つかりません', 'error');
        return;
      }

      currentEditId = id;
      
      const editFormFields = document.getElementById('editFormFields');
      editFormFields.innerHTML = '';

      headers.editable.forEach(field => {
        const formGroup = document.createElement('div');
        formGroup.className = 'form-group';
        
        const label = document.createElement('label');
        label.textContent = field;
        
        let input;
        if (field === 'Status') {
          input = document.createElement('select');
          input.innerHTML = '<option value="">選択してください</option><option value="Active">Active</option><option value="Inactive">Inactive</option>';
          input.value = row[field] || '';
        } else if (field.includes('Email')) {
          input = document.createElement('input');
          input.type = 'email';
          input.value = row[field] || '';
        } else {
          input = document.createElement('input');
          input.type = 'text';
          input.value = row[field] || '';
        }
        
        input.id = 'edit_field_' + field;
        input.name = field;
        if (field === 'Name' || field === 'Email') {
          input.required = true;
        }
        
        formGroup.appendChild(label);
        formGroup.appendChild(input);
        editFormFields.appendChild(formGroup);
      });

      document.getElementById('editModal').classList.remove('hidden');
    }

    // 編集モーダルを閉じる
    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      currentEditId = null;
    }

    // 編集フォーム送信
    document.getElementById('editForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      if (!currentEditId) return;

      const formData = new FormData(e.target);
      const data = {};
      
      for (let [key, value] of formData.entries()) {
        data[key] = value;
      }

      try {
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = '更新中...';

        await callAPI({ action: 'update', id: currentEditId, data: data });
        
        showMessage('データを更新しました', 'success');
        closeEditModal();
        await loadData();
        
        submitBtn.disabled = false;
        submitBtn.textContent = '更新';
      } catch (error) {
        showMessage('更新エラー: ' + error.message, 'error');
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.textContent = '更新';
      }
    });

    // データを削除
    async function deleteData(id) {
      if (!confirm('このデータを削除してもよろしいですか？')) {
        return;
      }

      try {
        await callAPI({ action: 'delete', id: id });
        showMessage('データを削除しました', 'success');
        await loadData();
      } catch (error) {
        showMessage('削除エラー: ' + error.message, 'error');
      }
    }

    // Active のみフィルタ
    function filterActive() {
      const filtered = allData.filter(row => row.Status === 'Active');
      renderTable(filtered);
    }

    // API呼び出し
    function callAPI(params) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success) {
              resolve(response.data);
            } else {
              reject(new Error(response.error || 'Unknown error'));
            }
          })
          .withFailureHandler(function(error) {
            reject(new Error(error.message || 'API call failed'));
          })
          .doPost({ postData: { contents: JSON.stringify(params) } });
      });
    }

    // メッセージを表示
    function showMessage(message, type) {
      const messageArea = document.getElementById('messageArea');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message message-${type}`;
      messageDiv.textContent = message;
      
      messageArea.innerHTML = '';
      messageArea.appendChild(messageDiv);
      
      setTimeout(() => {
        messageDiv.remove();
      }, 5000);
    }

    // HTMLエスケープ
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
